name: Build Android APK
on:
  push:
    branches: [main, growth-handbook-android]
    # the iOS project has its own check; changing only it does not make a new Android release
    paths-ignore:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "docs/**"
      - "qa/**"
      - ".github/workflows/qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Write the signing key from the repository secrets
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -z "$HB_KEYSTORE_B64" ]; then echo "::error title=Signing key missing::Add the HB_KEYSTORE_B64 and HB_KEYSTORE_PASSWORD secrets under Settings > Secrets and variables > Actions, then run this workflow again."; exit 1; fi
          echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Work out the version
        shell: bash
        run: |
          V="$(tr -d ' \r\n' < VERSION).${{ github.run_number }}"
          echo "VNAME=$V" >> "$GITHUB_ENV"
          echo "APK=monster-raising-$V.apk" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VNAME }}
          HB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "error:|e: |What went wrong|FAILURE|Could not|Caused by|> " build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle build::${msg}"
      - name: Name the APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || { echo "::error title=Unsigned build::The release APK was not signed."; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "$APK"
      - name: Publish a mirror copy for faster downloads
        continue-on-error: true
        shell: bash
        run: |
          cp RELEASE_NOTES.md release_body.md
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan dist-tmp
          git rm -rq --cached .
          git add -f "$APK"
          git commit -q -m "APK ${{ github.run_number }}"
          if out=$(git push -f origin dist-tmp:dist 2>&1); then
            SHA=$(git rev-parse HEAD)
            printf '\n\n<!-- mirror: https://cdn.jsdelivr.net/gh/${{ github.repository }}@%s/%s -->\n' "$SHA" "$APK" >> release_body.md
            curl -s -o /dev/null --max-time 60 "https://cdn.jsdelivr.net/gh/${{ github.repository }}@$SHA/$APK" || true
          else
            echo "::warning title=Mirror copy::$(echo "$out" | tr '\n' ' ')"
          fi
      - name: Make sure the release notes exist
        shell: bash
        run: test -f release_body.md || cp RELEASE_NOTES.md release_body.md
      - uses: actions/upload-artifact@v4
        with:
          name: growth-handbook-apk
          path: ${{ env.APK }}
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: 养小怪兽 ${{ env.VNAME }}
          files: ${{ env.APK }}
          body_path: release_body.md
      - name: Keep only the newest three releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q '.[] | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +4 | cut -f2 | while read -r t; do
              [ -n "$t" ] && gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag && echo "removed $t"
            done
