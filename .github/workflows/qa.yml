name: Android QA (emulator)
# Builds a debug APK of the same commit, runs it on an Android emulator and lets qa/runner.js walk qa/plan.json
# inside the app's own WebView: 47 baseline screens, both looks in light and dark, and the path tests
# (月龄切换, 返回, 计时杀进程恢复, 后台恢复, 系统返回键, 系统大字体, 热区). Screenshots are real device screenshots
# of the emulator (adb screencap). An emulator is not a phone: frame timing and touch feel still need a real device.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "qa/*.py"
      - "qa/*.js"
      - "qa/plan.json"
      - ".github/workflows/qa.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          V="$(tr -d ' \r\n' < VERSION).qa${{ github.run_number }}"
          VERSION_NAME="$V" gradle :app:assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Python tools
        run: pip install websocket-client==1.8.0
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 qa/android_qa.py app/build/outputs/apk/debug/app-debug.apk qa-out/android
      - name: Record the commit
        if: always()
        run: |
          mkdir -p qa-out/android
          echo "{\"commit\":\"${GITHUB_SHA}\",\"run\":\"${{ github.run_id }}\",\"run_number\":\"${{ github.run_number }}\"}" > qa-out/android/build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-android
          path: qa-out/android
          retention-days: 30
