name: Build Android APK
on:
  push:
    branches: [main, growth-handbook-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Write the signing key from the repository secrets
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -z "$HB_KEYSTORE_B64" ]; then echo "::error title=Signing key missing::Add the HB_KEYSTORE_B64 and HB_KEYSTORE_PASSWORD secrets under Settings > Secrets and variables > Actions, then run this workflow again."; exit 1; fi
          echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          HB_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "error:|e: |What went wrong|FAILURE|Could not|Caused by|> " build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Gradle build::${msg}"
      - name: Name the APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk || { echo "::error title=Unsigned build::The release APK was not signed."; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "monster-raising-1.${{ github.run_number }}.apk"
      - name: Publish a mirror copy for faster downloads
        shell: bash
        run: |
          set -e
          APK="monster-raising-1.${{ github.run_number }}.apk"
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/dist && mkdir /tmp/dist && cp "$APK" /tmp/dist/ && cd /tmp/dist
          git init -q -b dist && git add "$APK" && git commit -q -m "APK ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
          SHA=$(git rev-parse HEAD)
          cd "$GITHUB_WORKSPACE"
          cp RELEASE_NOTES.md release_body.md
          printf '\n\n<!-- mirror: https://cdn.jsdelivr.net/gh/${{ github.repository }}@%s/%s -->\n' "$SHA" "$APK" >> release_body.md
          curl -s -o /dev/null --max-time 60 "https://cdn.jsdelivr.net/gh/${{ github.repository }}@$SHA/$APK" || true
      - uses: actions/upload-artifact@v4
        with:
          name: growth-handbook-apk
          path: "monster-raising-1.${{ github.run_number }}.apk"
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handbook-1.${{ github.run_number }}
          name: 养小怪兽 1.${{ github.run_number }}
          files: "monster-raising-1.${{ github.run_number }}.apk"
          body_path: release_body.md
