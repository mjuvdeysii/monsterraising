plugins { id "com.android.application" }

android {
    namespace "cn.growthhandbook.app"
    compileSdk 34
    defaultConfig {
        applicationId "cn.growthhandbook.app"
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName = "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "growthhandbook"
            keyAlias "handbook"
            keyPassword "growthhandbook"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
