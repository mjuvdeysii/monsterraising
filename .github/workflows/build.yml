name: Build Android APK
on:
  push:
    branches: [main, growth-handbook-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "成长手册-1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: growth-handbook-apk
          path: "成长手册-1.${{ github.run_number }}.apk"
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handbook-1.${{ github.run_number }}
          name: 成长手册 1.${{ github.run_number }}
          files: "成长手册-1.${{ github.run_number }}.apk"
          body: 下载 APK 文件，在安卓手机上打开安装。更新时直接覆盖安装，勾选记录和出生日期会保留。
