name: Mossling (native app)
# Builds the native Compose app in native/: unit tests, Paparazzi screenshots of every screen, and a signed release
# APK. Screenshots and APK are uploaded as artifacts; the APK is also published as the prerelease "mossling-preview".
# The native app now lives in its own repository, mjuvdeysii/mossling; this copy only runs by hand.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and screenshots
        run: |
          set -o pipefail
          gradle :app:recordPaparazziDebug --no-daemon --stacktrace 2>&1 | tee ../native-test.log
      - name: Report compile and test errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:" ../native-test.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Native build::${msg}"
      - name: Signing key
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        run: |
          if [ -n "$HB_KEYSTORE_B64" ]; then echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee ../native-build.log
          cp app/build/outputs/apk/release/app-release.apk ../mossling-0.1.${{ github.run_number }}.apk
      - name: Report release build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|R8|Missing class" ../native-build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Native release::${msg}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mossling-screens
          path: native/app/src/test/snapshots/images
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mossling-apk
          path: mossling-0.1.${{ github.run_number }}.apk
          retention-days: 30
      - name: Preview release
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete mossling-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create mossling-preview "mossling-0.1.${{ github.run_number }}.apk" --prerelease --target "${GITHUB_SHA}" \
            --title "Mossling 苔生 预览 0.1.${{ github.run_number }}" \
            --notes "原生安卓版的开发预览，和现在的「养小怪兽」是两个独立的应用，可以同时安装，互不影响。"
      - name: Publish screenshots to the native-screens branch (for review)
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          [ -d native/app/src/test/snapshots/images ] || exit 0
          mkdir -p /tmp/screens && cp -r native/app/src/test/snapshots/images/. /tmp/screens/ && cp native-test.log /tmp/screens/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan screens-tmp && git rm -rqf --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/screens/. . && echo "${GITHUB_SHA}" > COMMIT && git add -A && git commit -qm "screens ${GITHUB_SHA}" && git push -qf origin screens-tmp:native-screens
